<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>QR gen v2</title></head>
<body style="background:#fff">
<script>
/* ---- GF(256) ---- */
var EXP=[],LOG=[];
(function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d;}
for(var i=255;i<512;i++)EXP[i]=EXP[i-255];})();
function gmul(a,b){if(a===0||b===0)return 0;return EXP[LOG[a]+LOG[b]];}
function genPoly(n){var g=[1];for(var i=0;i<n;i++){var ng=[];for(var k=0;k<=g.length;k++)ng[k]=0;
for(var j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=gmul(g[j],EXP[i]);}g=ng;}return g;}
function rsEnc(data,nec){var g=genPoly(nec),res=data.slice();
for(var i=0;i<nec;i++)res.push(0);
for(var i=0;i<data.length;i++){var c=res[i];if(c!==0)for(var j=0;j<g.length;j++)res[i+j]^=gmul(g[j],c);}
return res.slice(data.length);}
function syndromes(cw,nec){var s=[];for(var i=0;i<nec;i++){var v=0;
for(var j=0;j<cw.length;j++)v=gmul(v,EXP[i])^cw[j];s.push(v);}return s;}

/* ---- tablas RS por nivel: [ECperBloque, [[nBloques,dataCW],...]] ---- */
var TBL={
 M:{1:[10,[[1,16]]],2:[16,[[1,28]]],3:[26,[[1,44]]],4:[18,[[2,32]]],
    5:[24,[[2,43]]],6:[16,[[4,27]]],7:[18,[[4,31]]],8:[22,[[2,38],[2,39]]],
    9:[22,[[3,36],[2,37]]],10:[26,[[4,43],[1,44]]]},
 Q:{1:[13,[[1,13]]],2:[22,[[1,22]]],3:[18,[[2,17]]],4:[26,[[2,24]]],
    5:[18,[[2,15],[2,16]]],6:[24,[[4,19]]],7:[18,[[2,14],[4,15]]],8:[22,[[4,18],[2,19]]],
    9:[20,[[4,16],[4,17]]],10:[24,[[6,19],[2,20]]]},
 H:{1:[17,[[1,9]]],2:[28,[[1,16]]],3:[22,[[2,13]]],4:[16,[[4,9]]],
    5:[22,[[2,11],[2,12]]],6:[28,[[4,15]]],7:[26,[[4,13],[1,14]]],8:[26,[[4,14],[2,15]]],
    9:[24,[[4,12],[4,13]]],10:[28,[[6,15],[2,16]]]}
};
/* bits de nivel en el format info */
var ECLBITS={L:1,M:0,Q:3,H:2};
var ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],
7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
function dataCap(lv,v){var t=0;TBL[lv][v][1].forEach(function(g){t+=g[0]*g[1];});return t;}

/* ---- BCH ---- */
function bl(n){var c=0;while(n!==0){c++;n>>>=1;}return c;}
function bchInfo(d){var x=d<<10;while(bl(x)-bl(0x537)>=0)x^=0x537<<(bl(x)-bl(0x537));
return ((d<<10)|x)^0x5412;}
function bchVer(d){var x=d<<12;while(bl(x)-bl(0x1f25)>=0)x^=0x1f25<<(bl(x)-bl(0x1f25));
return (d<<12)|x;}

/* ---- mascaras ---- */
function maskFn(p,i,j){switch(p){
case 0:return (i+j)%2===0; case 1:return i%2===0; case 2:return j%3===0;
case 3:return (i+j)%3===0; case 4:return (Math.floor(i/2)+Math.floor(j/3))%2===0;
case 5:return (i*j)%2+(i*j)%3===0; case 6:return ((i*j)%2+(i*j)%3)%2===0;
case 7:return ((i+j)%2+(i*j)%3)%2===0;}}

/* ---- bitstream -> codewords finales ---- */
function buildCodewords(text,lv){
  var bytes=[],u=unescape(encodeURIComponent(text));
  for(var i=0;i<u.length;i++)bytes.push(u.charCodeAt(i));
  var v=0;
  for(var k=1;k<=10;k++){var cci=(k<10)?8:16;
    if(4+cci+8*bytes.length<=8*dataCap(lv,k)){v=k;break;}}
  if(!v)throw new Error('texto demasiado largo para v10-'+lv);
  var cci=(v<10)?8:16, bits=[];
  function push(val,len){for(var i=len-1;i>=0;i--)bits.push((val>>>i)&1);}
  push(4,4); push(bytes.length,cci);
  bytes.forEach(function(b){push(b,8);});
  var cap=8*dataCap(lv,v);
  for(var i=0;i<4&&bits.length<cap;i++)bits.push(0);
  while(bits.length%8!==0)bits.push(0);
  var dcw=[];
  for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|bits[i+j];dcw.push(b);}
  var pad=[0xEC,0x11],pi=0;
  while(dcw.length<dataCap(lv,v))dcw.push(pad[pi++%2]);

  var nec=TBL[lv][v][0], blocks=[], off=0;
  TBL[lv][v][1].forEach(function(g){for(var n=0;n<g[0];n++){
    var d=dcw.slice(off,off+g[1]); off+=g[1];
    blocks.push({d:d,e:rsEnc(d,nec)});}});

  var maxD=0,maxE=0;
  blocks.forEach(function(b){maxD=Math.max(maxD,b.d.length);maxE=Math.max(maxE,b.e.length);});
  var out=[];
  for(var i=0;i<maxD;i++)blocks.forEach(function(b){if(i<b.d.length)out.push(b.d[i]);});
  for(var i=0;i<maxE;i++)blocks.forEach(function(b){if(i<b.e.length)out.push(b.e[i]);});
  return {v:v,cw:out,blocks:blocks,nec:nec,dcw:dcw,bytes:bytes,lv:lv};
}

/* ---- matriz ---- */
function build(v,cw,mask,lv){
  var n=17+4*v, m=[];
  for(var i=0;i<n;i++){m[i]=[];for(var j=0;j<n;j++)m[i][j]=null;}
  function finder(r,c){
    for(var i=-1;i<=7;i++)for(var j=-1;j<=7;j++){
      if(r+i<0||r+i>=n||c+j<0||c+j>=n)continue;
      var on=(0<=i&&i<=6&&(j===0||j===6))||(0<=j&&j<=6&&(i===0||i===6))||(2<=i&&i<=4&&2<=j&&j<=4);
      m[r+i][c+j]=on?1:0;}}
  finder(0,0); finder(n-7,0); finder(0,n-7);
  ALIGN[v].forEach(function(r){ALIGN[v].forEach(function(c){
    if(m[r][c]!==null)return;
    for(var i=-2;i<=2;i++)for(var j=-2;j<=2;j++)
      m[r+i][c+j]=(i===-2||i===2||j===-2||j===2||(i===0&&j===0))?1:0;});});
  for(var i=8;i<n-8;i++){if(m[i][6]===null)m[i][6]=(i%2===0)?1:0;
                         if(m[6][i]===null)m[6][i]=(i%2===0)?1:0;}
  var fmt=bchInfo((ECLBITS[lv]<<3)|mask);
  for(var i=0;i<15;i++){var b=(fmt>>i)&1;
    if(i<6)m[i][8]=b; else if(i<8)m[i+1][8]=b; else m[n-15+i][8]=b;
    if(i<8)m[8][n-i-1]=b; else if(i<9)m[8][15-i-1+1]=b; else m[8][15-i-1]=b;}
  m[n-8][8]=1;
  if(v>=7){var vb=bchVer(v);
    for(var i=0;i<18;i++){var b=(vb>>i)&1;
      m[Math.floor(i/3)][i%3+n-8-3]=b; m[i%3+n-8-3][Math.floor(i/3)]=b;}}
  var inc=-1,row=n-1,bi=7,byi=0,order=[];
  for(var col=n-1;col>0;col-=2){
    if(col===6)col--;
    while(true){
      for(var c=0;c<2;c++){
        if(m[row][col-c]===null){
          var dark=0;
          if(byi<cw.length)dark=(cw[byi]>>>bi)&1;
          if(maskFn(mask,row,col-c))dark^=1;
          m[row][col-c]=dark;
          order.push(row+','+(col-c));
          bi--; if(bi===-1){byi++;bi=7;}}}
      row+=inc;
      if(row<0||row>=n){row-=inc;inc=-inc;break;}}}
  return {n:n,m:m,order:order};
}

function penalty(m,n){
  var p=0,i,j;
  for(i=0;i<n;i++)for(j=0;j<n;j++){
    var same=0,d=m[i][j];
    for(var r=-1;r<=1;r++){if(i+r<0||i+r>=n)continue;
      for(var c=-1;c<=1;c++){if(j+c<0||j+c>=n||(r===0&&c===0))continue;
        if(d===m[i+r][j+c])same++;}}
    if(same>5)p+=(3+same-5);}
  for(i=0;i<n-1;i++)for(j=0;j<n-1;j++){
    var cnt=m[i][j]+m[i][j+1]+m[i+1][j]+m[i+1][j+1];
    if(cnt===0||cnt===4)p+=3;}
  for(i=0;i<n;i++)for(j=0;j<n-6;j++)
    if(m[i][j]&&!m[i][j+1]&&m[i][j+2]&&m[i][j+3]&&m[i][j+4]&&!m[i][j+5]&&m[i][j+6])p+=40;
  for(j=0;j<n;j++)for(i=0;i<n-6;i++)
    if(m[i][j]&&!m[i+1][j]&&m[i+2][j]&&m[i+3][j]&&m[i+4][j]&&!m[i+5][j]&&m[i+6][j])p+=40;
  var dark=0;for(i=0;i<n;i++)for(j=0;j<n;j++)dark+=m[i][j];
  p+=Math.abs(Math.floor(dark*100/(n*n))-50)/5*10;
  return p;
}

function makeQR(text,lv){
  lv=lv||'M';
  var enc=buildCodewords(text,lv),best=null;
  for(var mk=0;mk<8;mk++){
    var r=build(enc.v,enc.cw,mk,lv),pt=penalty(r.m,r.n);
    if(!best||pt<best.p)best={p:pt,mask:mk,r:r};}
  return {v:enc.v,lv:lv,mask:best.mask,n:best.r.n,m:best.r.m,enc:enc,order:best.r.order};
}

/* ---- verificacion independiente ---- */
function verify(q,text){
  var n=q.n,m=q.m,rep=[];
  var bad=0;
  q.enc.blocks.forEach(function(b){
    var s=syndromes(b.d.concat(b.e),q.enc.nec);
    if(s.some(function(x){return x!==0;}))bad++;});
  rep.push(['sindromes RS cero en los '+q.enc.blocks.length+' bloques', bad===0]);
  var f1=0;
  for(var i=14;i>=0;i--){var b;
    if(i<6)b=m[i][8]; else if(i<8)b=m[i+1][8]; else b=m[n-15+i][8];
    f1=(f1<<1)|b;}
  var unmasked=f1^0x5412, ecl=(unmasked>>13)&3, mk=(unmasked>>10)&7;
  rep.push(['format info: ECC='+q.lv+' y mascara='+q.mask, ecl===ECLBITS[q.lv]&&mk===q.mask]);
  var eq=true;
  for(var i=0;i<15;i++){var a,c;
    if(i<6)a=m[i][8]; else if(i<8)a=m[i+1][8]; else a=m[n-15+i][8];
    if(i<8)c=m[8][n-i-1]; else if(i<9)c=m[8][15-i-1+1]; else c=m[8][15-i-1];
    if(a!==c)eq=false;}
  rep.push(['las dos copias de format info coinciden', eq]);
  var uniq={},dup=0; q.order.forEach(function(k){if(uniq[k])dup++;uniq[k]=1;});
  rep.push(['recorrido sin repetir modulos ('+Object.keys(uniq).length+' libres)', dup===0]);
  var got=[],bit=0,cur=0;
  q.order.forEach(function(k){
    var p=k.split(','),r=+p[0],c=+p[1],val=m[r][c];
    if(maskFn(q.mask,r,c))val^=1;
    cur=(cur<<1)|val; bit++;
    if(bit===8){got.push(cur);cur=0;bit=0;}});
  var same=true;
  for(var i=0;i<q.enc.cw.length;i++)if(got[i]!==q.enc.cw[i])same=false;
  rep.push(['relectura de la matriz devuelve los mismos '+q.enc.cw.length+' codewords', same]);
  var ok6=false,why='';
  try{
    var bl2=q.enc.blocks,maxD=0,p2=0,dparts=bl2.map(function(){return [];});
    bl2.forEach(function(b){maxD=Math.max(maxD,b.d.length);});
    for(var i=0;i<maxD;i++)for(var k2=0;k2<bl2.length;k2++)
      if(i<bl2[k2].d.length)dparts[k2].push(got[p2++]);
    var dcw2=[]; dparts.forEach(function(a){dcw2=dcw2.concat(a);});
    var eqd=dcw2.length===q.enc.dcw.length;
    for(var i=0;i<dcw2.length;i++)if(dcw2[i]!==q.enc.dcw[i])eqd=false;
    var v10=q.v>=10, mode=(dcw2[0]>>4)&0xF, len, base;
    if(v10){len=((dcw2[0]&0xF)<<12)|(dcw2[1]<<4)|((dcw2[2]>>4)&0xF); base=2;}
    else   {len=((dcw2[0]&0xF)<<4)|((dcw2[1]>>4)&0xF); base=1;}
    var s='';
    for(var i=0;i<len;i++)
      s+=String.fromCharCode(((dcw2[base+i]&0xF)<<4)|((dcw2[base+i+1]>>4)&0xF));
    ok6 = eqd && mode===4 && decodeURIComponent(escape(s))===text;
    if(!ok6) why=' [len='+len+' "'+s.slice(0,40)+'"]';
  }catch(e){ why=' ['+e+']'; }
  rep.push(['payload decodificado desde la matriz == URL original'+why, ok6]);
  var f=true;
  [[0,0],[0,n-7],[n-7,0]].forEach(function(p){
    for(var i=0;i<7;i++)for(var j=0;j<7;j++){
      var on=(i===0||i===6||j===0||j===6||(2<=i&&i<=4&&2<=j&&j<=4))?1:0;
      if(m[p[0]+i][p[1]+j]!==on)f=false;}});
  rep.push(['3 patrones localizadores correctos', f]);
  return rep;
}

/* cuantos modulos oscuros tapa un cuadrado central de k x k modulos */
function centerCost(q,k){
  var n=q.n,a=Math.floor((n-k)/2),cov=0;
  for(var i=a;i<a+k;i++)for(var j=a;j<a+k;j++)cov++;
  return {tapados:cov, total:n*n, pct:(100*cov/(n*n)).toFixed(1), desde:a, hasta:a+k-1};
}

function rowsOf(q){var rows=[],dark=0,rc=[];
  for(var i=0;i<q.n;i++){var r='',d=0;
    for(var j=0;j<q.n;j++){r+=q.m[i][j]?'1':'0'; d+=q.m[i][j];}
    rows.push(r); rc.push(d); dark+=d;}
  return {rows:rows,dark:dark,perRow:rc.join(',')};}

window.QR={makeQR:makeQR,verify:verify,rowsOf:rowsOf,centerCost:centerCost,_mask:maskFn};
</script>
</body></html>
